<link rel="stylesheet" href="../styles.css">
<div style="display:flex;gap:12px;height:110px;padding:20px 0;font-family:var(--font-body)">
<div style="flex:1;background:var(--success);border-radius:var(--radius-md);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px">Success</div>
<div style="flex:1;background:var(--warning);border-radius:var(--radius-md);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px">Warning</div>
<div style="flex:1;background:var(--danger);border-radius:var(--radius-md);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px">Danger</div>
</div>
