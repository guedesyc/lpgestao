<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<div id="root" style="padding:20px"></div>
<script type="text/babel">
const { Input, Select, Checkbox, Radio } = window.GrupoLemosPassosDesignSystem_e340d6;
function Demo(){
  const [plan, setPlan] = React.useState('m');
  return <div style={{display:'flex',gap:'32px',flexWrap:'wrap'}}>
    <div style={{display:'flex',flexDirection:'column',gap:'16px'}}>
      <Input label="Nome da empresa" placeholder="Grupo LemosPassos" helpText="Como aparece no contrato" />
      <Input label="E-mail" placeholder="voce@empresa.com" error="Informe um e-mail válido" />
      <Select label="Unidade de negócio" options={["Restaurantes","Alimentação Escolar","Alimentação Hospitalar","Services"]} />
    </div>
    <div style={{display:'flex',flexDirection:'column',gap:'14px'}}>
      <Checkbox label="Aceito os termos" checked={true} />
      <Checkbox label="Receber novidades" checked={false} />
      <Checkbox label="Desabilitado" disabled />
      <Radio name="plan" label="Mensal" checked={plan==='m'} onChange={()=>setPlan('m')} />
      <Radio name="plan" label="Anual" checked={plan==='a'} onChange={()=>setPlan('a')} />
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
