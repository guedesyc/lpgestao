name: Deploy LP Gestao to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /lpgestao
      - name: Normalize project-site asset folder
        run: |
          # vinext places assetPrefix files under dist/client/lpgestao.
          # The Pages artifact itself is already mounted at /lpgestao.
          if [ -d dist/client/lpgestao ]; then
            cp -R dist/client/lpgestao/. dist/client/
            rm -rf dist/client/lpgestao
          fi
      - name: Disable Jekyll processing
        run: touch dist/client/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
